<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: 'Google Sans', Roboto, Arial, sans-serif;
      font-size: 14px; color: #202124; margin: 0; padding: 20px; background: #fff;
    }
    .row { margin-bottom: 14px; }
    .row.split { display: flex; gap: 12px; }
    .row.split > div { flex: 1; }
    label { display: block; font-weight: 500; margin-bottom: 5px; }
    input, select {
      width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 14px;
      border: 1px solid #dadce0; border-radius: 4px; outline: none; font-family: inherit;
    }
    input:focus, select:focus { border-color: #1a73e8; }
    input[readonly] { background: #f1f3f4; color: #5f6368; }
    .hint { color: #5f6368; font-size: 12px; margin-top: 4px; }
    .actions { margin-top: 20px; text-align: right; }
    button {
      font-family: inherit; font-size: 14px; font-weight: 500;
      padding: 9px 20px; border-radius: 4px; border: none; cursor: pointer;
    }
    button.primary { background: #1a73e8; color: #fff; }
    button.primary:disabled { background: #a8c7fa; cursor: default; }
    button.secondary { background: none; color: #1a73e8; margin-right: 8px; }
    .msg { margin-top: 14px; padding: 10px 12px; border-radius: 4px; display: none; line-height: 1.5; }
    .msg.visible { display: block; }
    .msg.ok { background: #e6f4ea; color: #137333; }
    .msg.err { background: #fce8e6; color: #c5221f; }
  </style>
</head>
<body>
  <div class="row split">
    <div>
      <label for="month">Month</label>
      <input type="text" id="month" value="<?= defaults.month ?>" readonly>
    </div>
    <div>
      <label for="year">Year</label>
      <input type="text" id="year" value="<?= defaults.year ?>" readonly>
    </div>
  </div>
  <div class="hint" style="margin-top:-8px;margin-bottom:14px;">
    Read-only: the period is driven by the “Monthly Budget” selector. To change
    month, close this dialog, change it in the sheet and reopen this window.
  </div>

  <div class="row">
    <label for="threshold">Deviation threshold (%)</label>
    <input type="number" id="threshold" value="<?= defaults.threshold ?>" min="1" max="500">
    <div class="hint">Below this percentage, a category is not broken down.</div>
  </div>

  <div class="row">
    <label for="destination">Output</label>
    <select id="destination">
      <option value="both">Sheet tab and email draft</option>
      <option value="sheet">Sheet tab only</option>
      <option value="draft">Email draft only</option>
    </select>
  </div>

  <div class="row">
    <label for="email">Client email</label>
    <input type="email" id="email" placeholder="client@example.com">
    <div class="hint">A draft is created. Nothing is ever sent automatically.</div>
  </div>

  <div class="row">
    <label for="name">Greeting</label>
    <input type="text" id="name" placeholder="Hi Ana">
  </div>

  <div class="msg" id="msg"></div>

  <div class="actions">
    <button class="secondary" onclick="google.script.host.close()">Cancel</button>
    <button class="primary" id="go" onclick="generar()">Generate</button>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function generar() {
      $('go').disabled = true;
      mostrar('Generating…', 'ok');

      google.script.run
        .withSuccessHandler(alTerminar)
        .withFailureHandler(function (e) { mostrar(e.message, 'err'); $('go').disabled = false; })
        .runReportGeneration({
          month: $('month').value.trim(),
          year: $('year').value.trim(),
          threshold: Number($('threshold').value),
          destination: $('destination').value,
          clientEmail: $('email').value.trim(),
          clientName: $('name').value.trim(),
        });
    }

    function alTerminar(r) {
      $('go').disabled = false;
      mostrar(r.message, r.ok ? 'ok' : 'err');
    }

    function mostrar(texto, tipo) {
      const m = $('msg');
      m.textContent = texto;
      m.className = 'msg visible ' + tipo;
    }
  </script>
</body>
</html>
